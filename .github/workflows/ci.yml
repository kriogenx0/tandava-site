name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds the same Dockerfile Coolify builds, starts it, and checks that the
  # home page answers. Deploys don't wait on this: Coolify Auto Deploy builds
  # each push to main itself, and a failed build leaves the live site up.
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t tandava-site .
      - name: Serve and check
        run: |
          docker run -d --name tandava-site -p 8080:80 tandava-site
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          docker logs tandava-site
          exit 1

