# HTTP-only vhost installed first so certbot's http-01 challenge has
# somewhere to be served from. deploy.sh swaps this for tandavacult.com.conf
# (the full HTTPS vhost) once the cert exists.
server {
    listen 80;
    listen [::]:80;
    server_name tandavacult.com www.tandavacult.com;

    include snippets/acme-challenge.conf;

    root /var/www/tandavacult.com;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
