# Static site, no container -- nginx serves the built files directly out of
# /var/www/tandavacult.com. The Dockerfile/Makefile in this repo are for
# local preview only (`make dev`/`make run`); production skips the
# container and serves the same files straight from disk. Plain HTTP still
# needs to answer for renewals' http-01 challenge, so it stays around as a
# redirect rather than being dropped once HTTPS is up.
server {
    listen 80;
    listen [::]:80;
    server_name tandavacult.com www.tandavacult.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tandavacult.com www.tandavacult.com;

    ssl_certificate     /etc/letsencrypt/live/tandavacult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tandavacult.com/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/tandavacult.com;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
